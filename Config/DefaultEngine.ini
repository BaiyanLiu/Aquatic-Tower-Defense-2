[SystemSettings]
; always render the 3D view at the window's native resolution: left at 0, the engine's default
; drops to about 53% on a 3840x1600 window and stretches the result, which blurs the whole board
r.ScreenPercentage=100
r.ScreenPercentage.Default=100
r.ScreenPercentage.Default.Desktop.Mode=0
r.DynamicRes.OperationMode=0
; FXAA softens fine detail a little, this brings it back
r.Tonemapper.Sharpen=0.6
; every see-through material in the game is unlit, so nothing reads the lighting volume these two pay for
r.TranslucencyLightingVolume=0
r.Lumen.TranslucencyVolume.Enable=0
; the camera looks down on an open, flat board, so almost nothing is ever fully hidden and occlusion culling
; has nothing to cull; its GPU queries only made the render thread wait for last frame's results (heavy wave: median frame 15.3 -> 7.4 ms)
r.AllowOcclusionQueries=0

